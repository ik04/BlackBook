root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/app main.go"
  bin = "tmp/app"
  full_bin = ""
  log = "build.log"
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_ext = ["md"]
  delay = 1000  # debounce in milliseconds
  stop_on_error = true
  kill_delay = "2s"

[log]
  level = "debug"
  time = true

[watch]
  exclude = ["tmp", "vendor", "**/*.md"]
  include = ["."]
  follow_symlink = true

[run]
  cmd = ""
  bin = "tmp/app"
  delay = 100
  restart_on_error = true
  grace_period = "0s"
